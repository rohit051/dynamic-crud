openapi: 3.0.1
info:
  title: AI Dynamic CRUD API
  version: 1.0.0
  description: >
    Swagger/OpenAPI specification for the backend of the AI Dynamic CRUD
    application. Includes authentication and dynamic entity endpoints.
servers:
  - url: /api
paths:
  /auth/register:
    post:
      summary: Register new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                phone:
                  type: string
      responses:
        '200':
          description: User created, verification email sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  message:
                    type: string
        '400':
          description: Bad request (missing/invalid data)
        '409':
          description: User already exists
        '500':
          description: Server error
  /auth/login:
    post:
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '400': { description: Missing fields }
        '401': { description: Invalid credentials }
        '403': { description: Unverified or inactive }
        '500': { description: Server error }
  /auth/forgot-password:
    post:
      summary: Request password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Email sent if account exists
        '400': { description: Missing email }
        '500': { description: Server error }
  /auth/reset-password:
    post:
      summary: Reset password using token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token:
                  type: string
                newPassword:
                  type: string
      responses:
        '200': { description: Password reset }
        '400': { description: Invalid or expired token }
        '500': { description: Server error }
  /auth/verify-email:
    post:
      summary: Verify email address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '200': { description: Email verified }
        '400': { description: Invalid token }
        '500': { description: Server error }
  /auth/resend-verification:
    post:
      summary: Resend verification token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200': { description: Verification email resent }
        '400': { description: Missing/invalid email or already verified }
        '500': { description: Server error }
  '/{entity}':
    get:
      summary: List documents for entity
      parameters:
        - in: path
          name: entity
          required: true
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: paginated list
          content:
            application/json:
              schema:
                type: object
                properties:
                  docs:
                    type: array
                    items:
                      type: object
                  total:
                    type: integer
                  page:
                    type: integer
                  pages:
                    type: integer
        '400': { description: Bad request }
        '403': { description: Unauthorized for certain entities }
        '500': { description: Server error }
    post:
      summary: Create document
      parameters:
        - in: path
          name: entity
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Created document
          content:
            application/json:
              schema:
                type: object
        '400': { description: Validation error }
        '403': { description: Unauthorized }
        '500': { description: Server error }
  '/{entity}/{id}':
    put:
      summary: Update document by id
      parameters:
        - in: path
          name: entity
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200': { description: Updated document }
        '400': { description: Bad request }
        '404': { description: Not found }
        '500': { description: Server error }
    delete:
      summary: Delete document by id
      parameters:
        - in: path
          name: entity
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200': { description: Deleted }
        '400': { description: Bad request }
        '404': { description: Not found }
        '500': { description: Server error }
components:
  schemas:
    User:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
        phone:
          type: string
        isVerified:
          type: boolean
        isActive:
          type: boolean
